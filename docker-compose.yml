services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    networks:
      - spam-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    networks:
      - spam-net
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

# Réseau partagé : l'interface joint l'API par son nom de service (http://api:8000)
networks:
  spam-net:
    driver: bridge
